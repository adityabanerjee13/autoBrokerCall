server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA. Any unknown path falls through to index.html so the router owns
    # /broker, /client, /manager and /handset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api is proxied to the backend, which makes the frontend
    # same-origin with the API. That is why VITE_API_BASE is empty in the image:
    # no CORS, and no build-time knowledge of where the backend lives.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The handset's open line arrives at /api/handset/{call_id}/line as
        # a websocket upgrade, so these two headers are load-bearing, not
        # boilerplate.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A voice call holds this socket open for the length of the call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
